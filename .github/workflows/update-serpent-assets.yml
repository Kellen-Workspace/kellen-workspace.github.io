name: Update serpent photos and logs

on:
  push:
    branches: [main]
    paths:
      - "lab/serpent-phylogeny/taxa/**"
      - "scripts/update_serpent_photos.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build photo and log manifests
        run: python scripts/update_serpent_photos.py
      - name: Commit generated manifests
        run: |
          if git diff --quiet -- lab/serpent-phylogeny/photos/manifest.js lab/serpent-phylogeny/logs/manifest.js; then
            echo "No manifest changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/serpent-phylogeny/photos/manifest.js lab/serpent-phylogeny/logs/manifest.js
          git commit -m "Update serpent photo and log manifests"
          git push
