name: Update industry data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 5 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-industry.txt
      - run: python scripts/update_sw_industry.py --refresh
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invest/industries/data/sw-industry.json
          git diff --cached --quiet || git commit -m "Update Shenwan industry data"
          git push
